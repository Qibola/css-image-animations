<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Image Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>CSS Image Animations</h1>
    <p class="subtitle">
      Still images brought to life with nothing but <code>@keyframes</code>.
    </p>
  </header>

  <main class="gallery">
    <figure class="card">
      <div class="art" role="img" aria-label="A sun setting over rolling hills"></div>
      <figcaption>
        <h2>Static</h2>
        <p>The starting point: no animation yet.</p>
      </figcaption>
    </figure>
    <figure class="card">
      <div class="art art--fade-in" role="img" aria-label="A sun setting over rolling hills, fading into view"></div>
      <figcaption>
        <h2>Fade in</h2>
        <p>Opacity and brightness eased from 0 on load, via <code>@keyframes</code>.</p>
      </figcaption>
    </figure>
    <figure class="card">
      <div class="art art--slide-in" role="img" aria-label="A sun setting over rolling hills, sliding in from the left"></div>
      <figcaption>
        <h2>Slide in</h2>
        <p>Moved into place with <code>transform: translateX()</code> — no layout reflow.</p>
      </figcaption>
    </figure>
    <figure class="card">
      <div class="art art--zoom-spin" role="img" aria-label="A sun setting over rolling hills, spinning as it zooms into view"></div>
      <figcaption>
        <h2>Zoom &amp; spin</h2>
        <p>One <code>transform</code> combining <code>scale()</code> and <code>rotate()</code>.</p>
      </figcaption>
    </figure>
    <figure class="card">
      <div class="art art--hover-pan" role="img" tabindex="0"
           aria-label="A sun setting over rolling hills, slowly panning while hovered"></div>
      <figcaption>
        <h2>Hover to pan</h2>
        <p>Always attached but <code>paused</code>; <code>:hover</code> only flips <code>animation-play-state</code>.</p>
      </figcaption>
    </figure>
  </main>

  <footer class="page-footer">
    <p>Day 5 of 6 &middot; fade-in, slide-in, zoom &amp; spin, hover pan</p>
  </footer>
</body>
</html>
